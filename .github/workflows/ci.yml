name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test
        env:
          CI: true
          NODE_ENV: test

      - name: Build TypeScript
        run: npm run build

      - name: Validate deployment shell and systemd artifacts (static only)
        run: |
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          # setup-node uses the hosted toolcache, not the production /usr/bin layout.
          # Verify temporary copies with only executable paths adapted to this host.
          export SYSTEMD_VERIFY_DIR="$(mktemp -d)"
          export SYSTEMD_VERIFY_NODE="$(command -v node)"
          export SYSTEMD_VERIFY_NPM="$(command -v npm)"
          python3 - <<'PY'
          import os
          from pathlib import Path
          destination = Path(os.environ['SYSTEMD_VERIFY_DIR'])
          for source in Path('deploy/systemd').iterdir():
              if source.suffix not in {'.service', '.timer'}:
                  continue
              text = source.read_text(encoding='utf-8')
              text = text.replace('/usr/bin/node', os.environ['SYSTEMD_VERIFY_NODE'])
              text = text.replace('/usr/bin/npm', os.environ['SYSTEMD_VERIFY_NPM'])
              (destination / source.name).write_text(text, encoding='utf-8')
          PY
          systemd-analyze verify "$SYSTEMD_VERIFY_DIR"/*.service "$SYSTEMD_VERIFY_DIR"/*.timer
