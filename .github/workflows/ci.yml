name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test
        env:
          CI: true
          NODE_ENV: test

      - name: Build TypeScript
        run: npm run build

      - name: Validate deployment shell and systemd artifacts (static only)
        run: |
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          systemd-analyze verify deploy/systemd/uma-bot.service deploy/systemd/uma-bot-backup.service deploy/systemd/uma-bot-backup.timer deploy/systemd/uma-bot-commands.service
